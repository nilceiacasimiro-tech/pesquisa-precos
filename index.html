  svg.i{width:22px;height:22px;fill:currentColor}
  .list{display:flex;flex-direction:column;gap:12px;margin-top:16px}

function authMessage(status, j){
  const code = String((j && (j.error_code || j.error || j.code)) || "");

  if (status === 422 || /weak|password/i.test(code)) return "Senha fraca: use pelo menos 8 caracteres, com letras e números.";

}

function productsFor(cid){
  const ord = cid && S.orders[cid];
  if (!ord) return S.products;
  const map = new Map(S.products.map(p => [p.id, p])), seen = new Set(), out = [];
  for (const id of ord) { const p = map.get(id); if (p && !seen.has(id)) { out.push(p); seen.add(id); } }
  for (const p of S.products) if (!seen.has(p.id)) out.push(p);   // itens que ainda não estavam na ordem dele
  return out;
}

  for (const p of list || S.products) { const k = groupKey(p.name); if (!map.has(k)) { map.set(k, []); order.push(k); } map.get(k).push(p); }

function ean13Check(d12){
  let sum = 0;

  return String((10 - sum % 10) % 10);
}
function sanitizeEAN13(code){
  if (!/^\d{13}$/.test(code)) return null;
  return code.slice(0,12) + ean13Check(code.slice(0,12));
}

  bits += "01010";

  bits += "101";

  const guards = new Set([0,1,2,45,46,47,48,49,92,93,94]);

    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(8,0,true);
    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,nb.length,true);

    c.setUint16(28,nb.length,true); c.setUint32(42,off,true);

/* ---------- fotos (IndexedDB: guarda só a última foto de cada item em cada concorrente) ---------- */
const PhotoDB = (() => {
  let dbp = null;
  function db(){
    if (!dbp) dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open("dscanner-fotos", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("fotos");
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      } catch(e) { rej(e); }
    });
    return dbp;
  }
  async function run(mode, fn){
    const d = await db();
    return new Promise((res, rej) => {
      const t = d.transaction("fotos", mode); const req = fn(t.objectStore("fotos"));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error);
    });
  }
  return {
    put: (k, blob) => run("readwrite", s => s.put(blob, UKEY + "|" + k)),
    get: k => run("readonly", s => s.get(UKEY + "|" + k)),
    del: k => run("readwrite", s => s.delete(UKEY + "|" + k)).catch(() => {}),
    getRaw: k => run("readonly", s => s.get(k)),

})();

function imageToCanvas(img, max, gray, upscale){
  const s = upscale ? max / Math.max(img.naturalWidth, img.naturalHeight) : Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  const g = c.getContext("2d"); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high"; g.drawImage(img, 0, 0, c.width, c.height);
  if (gray) {
    const d = g.getImageData(0, 0, c.width, c.height), a = d.data;
    for (let i = 0; i < a.length; i += 4) {
      let v = 0.299*a[i] + 0.587*a[i+1] + 0.114*a[i+2];
      v = Math.max(0, Math.min(255, (v - 128) * 1.4 + 128));   // mais contraste
      a[i] = a[i+1] = a[i+2] = v;
    }
    g.putImageData(d, 0, 0);
  }
  return c;
}
/* inverte só as áreas escuras da etiqueta (preço branco em fundo preto vira preto em fundo branco) */
function darkInverted(src){
  const c = imageToCanvas(src, 1000, false, true), W = c.width, H = c.height;
  const g = c.getContext("2d"), d = g.getImageData(0, 0, W, H), a = d.data;
  const gray = new Float32Array(W * H);
  for (let i = 0, j = 0; j < gray.length; i += 4, j++) gray[j] = 0.299*a[i] + 0.587*a[i+1] + 0.114*a[i+2];
  const I = new Float64Array((W + 1) * (H + 1));
  for (let y = 0; y < H; y++) { let row = 0; for (let x = 0; x < W; x++) { row += gray[y*W + x]; I[(y+1)*(W+1) + x+1] = I[y*(W+1) + x+1] + row; } }
  const r = Math.round(W * 0.08);
  let mask = new Uint8Array(W * H), dark = 0;
  for (let y = 0; y < H; y++) {
    const y0 = Math.max(0, y - r), y1 = Math.min(H, y + r + 1);
    for (let x = 0; x < W; x++) {
      const x0 = Math.max(0, x - r), x1 = Math.min(W, x + r + 1);
      const s = I[y1*(W+1) + x1] - I[y0*(W+1) + x1] - I[y1*(W+1) + x0] + I[y0*(W+1) + x0];
      if (s / ((x1 - x0) * (y1 - y0)) < 100) { mask[y*W + x] = 1; dark++; }
    }
  }
  if (dark < W * H * 0.03) return null;   // não tem área escura
  const k = 4, tmp = new Uint8Array(W * H);   // alarga a máscara um pouco
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let m = 0; for (let dx = -k; dx <= k && !m; dx++) { const xx = x + dx; if (xx >= 0 && xx < W && mask[y*W + xx]) m = 1; } tmp[y*W + x] = m; }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let m = 0; for (let dy = -k; dy <= k && !m; dy++) { const yy = y + dy; if (yy >= 0 && yy < H && tmp[yy*W + x]) m = 1; } mask[y*W + x] = m; }
  for (let j = 0, i = 0; j < gray.length; j++, i += 4) {
    let v = mask[j] ? 255 - gray[j] : gray[j];
    v = Math.max(0, Math.min(255, (v - 128) * 1.4 + 128));
    a[i] = a[i+1] = a[i+2] = v;
  }
  g.putImageData(d, 0, 0);
  return c;
}

/* Acha os valores grandes da etiqueta (os preços) */
function findPrices(words, text){
  const W = (words || []).map(w => ({ t: String(w.text || "").trim(), b: w.bbox || {x0:0,y0:0,x1:0,y1:0} }))
    .map(w => ({ ...w, h: w.b.y1 - w.b.y0, cx: (w.b.x0 + w.b.x1) / 2, cy: (w.b.y0 + w.b.y1) / 2 }));
  const fix = s => s.replace(/[Oo]/g, "0").replace(/[Il|]/g, "1").replace(/[Ss](?=\d)/g, "5");
  const cands = [];
  W.forEach((w, i) => {
    const t = fix(w.t);
    let m = t.match(/(\d{1,4})[,.](\d{2})(?!\d)/);
    if (m) { cands.push({ v: +(m[1] + "." + m[2]), h: w.h, cx: w.cx, cy: w.cy, y0: w.b.y0 }); return; }
    // centavos separados/pequenos: "21" "90" ou "21" ",90"
    m = t.match(/^(?:R\$)?(\d{1,4})[,.]?$/);
    if (m) {
      const n = W[i+1]; if (!n) return;
      const nm = fix(n.t).match(/^[,.]?(\d{2})$/);
      const sameLine = n.b.y0 < w.b.y1 && n.b.x0 >= w.b.x1 - 4 && n.b.x0 - w.b.x1 < w.h * 1.5;
      if (nm && sameLine) cands.push({ v: +(m[1] + "." + nm[1]), h: w.h, cx: w.cx, cy: w.cy, y0: w.b.y0 });
    }
  });
  let ok = cands.filter(c => c.v >= 0.1 && c.v < 10000);
  if (!ok.length) {
    const all = [...fix(text || "").matchAll(/(\d{1,4})\s?[,.]\s?(\d{2})(?!\d)/g)].map(m => +(m[1] + "." + m[2])).filter(v => v >= 0.1);
    return { vals: all };
  }
  // só os números grandes (os preços); descarta "média litro", "trib", "cxa"
  const maxH = Math.max(...ok.map(c => c.h));
  return { vals: [...new Set(ok.filter(c => c.h >= maxH * 0.6).map(c => c.v))] };
}
/* junta as leituras e escolhe o MENOR preço (descarta números que não parecem preço da mesma etiqueta) */
function lowestPrice(lists){
  const all = lists.flat().filter(v => v > 0);
  if (!all.length) return null;
  const mx = Math.max(...all);
  return Math.min(...all.filter(v => v >= mx * 0.5));
}

/* Acha o produto da minha lista que mais combina com o texto da etiqueta */
const STOP = new Set(["de","da","do","das","dos","com","e","em","para","un","und","pct","cx","rs","r","preco","oferta","kg","g","ml","l","lt","por","t1","tp1","tipo"]);
function tokens(s){
  return norm(s).replace(/(\d+)[.,]?(\d*)\s*(kg|g|gr|ml|l|lt|lts)\b/g, (_, a, b, u) => a + (b ? "." + b : "") + ({gr:"g",lt:"l",lts:"l"}[u] || u))
    .split(/[^a-z0-9.]+/).map(t => t.replace(/^\.+|\.+$/g, "")).filter(t => t.length >= 2 && !STOP.has(t));
}
const isSize = t => /^\d+(\.\d+)?(kg|g|ml|l)$/.test(t);
function tokScore(pt, tagSet){
  if (tagSet.has(pt)) return 1;
  if (isSize(pt)) return 0;
  for (const t of tagSet) {
    if (t.length >= 3 && pt.startsWith(t)) return 0.75;   // abreviação na etiqueta: "arr" = "arroz"
    if (pt.length >= 3 && t.startsWith(pt)) return 0.9;    // abreviação no meu cadastro: "parb" = "parboilizado"
    if (pt.length >= 5 && t.length >= 5 && lev(pt, t) <= 1) return 0.85;   // erro de leitura
  }
  return 0;
}
function lev(a, b){
  if (Math.abs(a.length - b.length) > 1) return 2;
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function matchProducts(text, cid, ean){
  const tagToks = tokens(text), tagSet = new Set(tagToks);
  const digits = (text.match(/\d{8,14}/g) || []); if (ean) digits.push(ean);
  // 1º: código de barras já vinculado (vale para todos os concorrentes)
  if (ean) {
    const al = [...S.aliases].reverse().find(a => a.ean === ean);
    const p = al && S.products.find(x => x.id === al.productId);
    if (p) return [{ p, s: 1000, linked: true }];
  }
  const scores = new Map();
  for (const p of S.products) {
    let s = 0;
    if (p.barCode && digits.includes(p.barCode)) s = 100;
    else {
      const pt = tokens(p.name); if (!pt.length) continue;
      let got = 0, w = 0, hits = 0;
      for (const t of pt) { const k = isSize(t) ? 2 : 1; w += k; const sc = tokScore(t, tagSet); got += k * sc; if (sc > 0) hits++; }
      s = got / w + 0.05 * hits;   // mais palavras em comum = desempate
      const sizes = pt.filter(isSize);
      if (sizes.length && sizes.some(z => !tagSet.has(z)) && tagToks.some(isSize)) s *= 0.6;   // tamanho diferente
    }
    scores.set(p.id, s);
  }
  return [...scores.entries()].filter(([, s]) => s > 0.25).sort((a, b) => b[1] - a[1]).map(([id, s]) => ({ p: S.products.find(x => x.id === id), s }));
}
/* ---------- vínculo pela DESCRIÇÃO da etiqueta ---------- */
// palavras que aparecem em toda etiqueta e não dizem qual é o produto
const GENERIC = new Set("preco precos unidade unidades partir varejo atacado media litro litros trib cxa und uni oferta ref promocao valido ate por com para quilo cada leve pague".split(" "));
const GEN = [...GENERIC];
function grams(t){ const s = " " + t + " "; const g = new Set(); for (let i = 0; i < s.length - 2; i++) g.add(s.slice(i, i + 3)); return g; }
function wsim(a, b){   // parecença entre palavras (aguenta erros de leitura)
  if (a === b) return 1;
  const A = grams(a), B = grams(b); let n = 0; for (const x of A) if (B.has(x)) n++;
  return 2 * n / (A.size + B.size);
}
function descTokens(text){
  return [...new Set(norm(text || "").replace(/[^a-z\s]/g, " ").split(/\s+/)
    .filter(t => t.length >= 3 && !GENERIC.has(t) && !GEN.some(g => g.length >= 5 && wsim(t, g) >= 0.5)))].slice(0, 60);
}
function sampleScore(newToks, toks, df, N){
  let tot = 0, got = 0;
  for (const t of toks) {
    const w = Math.log((N + 1) / ((df.get(t) || 0) + 0.5));   // palavra comum em várias etiquetas vale menos
    if (w <= 0) continue;
    let best = 0; for (const u of newToks) { const s = wsim(t, u); if (s > best) best = s; }
    tot += w; got += w * (best >= 0.45 ? best : 0);
  }
  return tot ? got / tot : 0;
}
function linkMatch(text, cid){
  const L = S.links.filter(l => l.cid === cid); if (!L.length) return [];
  const q = descTokens(text); if (!q.length) return [];
  const df = new Map(); for (const l of L) for (const t of l.toks) df.set(t, (df.get(t) || 0) + 1);
  const best = new Map();
  for (const l of L) { const s = sampleScore(q, l.toks, df, L.length); if (s > (best.get(l.pid) || 0)) best.set(l.pid, s); }
  return [...best.entries()].map(([pid, s]) => ({ p: S.products.find(x => x.id === pid), s })).filter(r => r.p).sort((a, b) => b.s - a.s);
}
function rememberLink(cid, text, pid){
  const toks = descTokens(text); if (!toks.length) return;
  // tira vínculos de OUTROS itens com etiqueta quase igual (foi um vínculo errado corrigido)
  S.links = S.links.filter(l => !(l.cid === cid && l.pid !== pid && sampleScore(toks, l.toks, new Map(), 1) >= 0.6));
  S.links.push({ cid, pid, toks, at: Date.now() });
  const mine = S.links.filter(l => l.cid === cid && l.pid === pid);
  if (mine.length > 4) { const old = mine[0]; S.links = S.links.filter(l => l !== old); }   // guarda as 4 últimas fotos
  if (S.links.length > 5000) S.links.splice(0, S.links.length - 5000);
}
function rememberAlias(cid, text, productId, ean){
  if (!ean) return;
  S.aliases = S.aliases.filter(a => a.ean !== ean);
  S.aliases.push({ cid, ean, toks: [], productId });
}

/* Preço: igual ao app – digite só números, os 2 últimos são centavos */
function bindPriceInput(inp, initialCents, onEnter){
  let digits = initialCents > 0 ? String(initialCents) : "";
  const fmt = () => brl((parseInt(digits || "0", 10)) / 100);
  const put = () => { inp.value = fmt(); const L = inp.value.length; try { inp.setSelectionRange(L, L); } catch(e) {} };
  inp.value = fmt();
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); onEnter && onEnter(); return; }
    if (e.key === "Backspace") { e.preventDefault(); digits = digits.slice(0, -1); put(); return; }
    if (/^\d$/.test(e.key)) { e.preventDefault(); if (digits.length < 9) digits = (digits + e.key).replace(/^0+/, ""); put(); return; }
  });
  inp.addEventListener("input", () => { digits = inp.value.replace(/\D/g, "").replace(/^0+/, "").slice(0, 9); put(); });
  inp.addEventListener("focus", () => setTimeout(put, 0));
  return {
    value: () => parseInt(digits || "0", 10) / 100,
    set: v => { digits = v > 0 ? String(Math.round(v * 100)) : ""; inp.value = fmt(); }
  };
}

}

const MAX_PHOTO_MB = 25, MAX_BATCH = 60;
function acceptImages(files){
  const ok = [], bad = [];
  for (const f of files) (f && /^image\//.test(f.type || "image/") && f.size > 0 && f.size <= MAX_PHOTO_MB * 1048576 ? ok : bad).push(f);
  if (bad.length) toast(`${bad.length} arquivo(s) ignorado(s): só fotos de até ${MAX_PHOTO_MB} MB`);
  if (ok.length > MAX_BATCH) { toast(`Máximo de ${MAX_BATCH} fotos por vez`); return ok.slice(0, MAX_BATCH); }
  return ok;
}

/* ---------- modo rápido: as fotos entram numa fila e são lidas em segundo plano ---------- */
const Q = { items: [], running: false, ok: 0, pend: 0, check: 0, hideT: null };
function quickAdd(files, cid){
  for (const f of files) Q.items.push({ file: f, cid });
  updateQBar(); runQueue();
}
async function runQueue(){
  if (Q.running) return; Q.running = true;
  while (Q.items.length) {
    updateQBar();
    try { await processQuick(Q.items[0]); } catch(e) {}
    Q.items.shift(); updateQBar();
  }
  Q.running = false; updateQBar();
}
function updateQBar(){
  const el = document.getElementById("qbar"); if (!el) return;
  clearTimeout(Q.hideT);
  const tot = Q.ok + Q.pend;
  if (!Q.items.length && !tot) { el.hidden = true; return; }
  el.hidden = false;
  const parts = [];
  if (Q.items.length) parts.push(`<span class="spin"></span> Lendo ${Q.items.length} foto${Q.items.length > 1 ? "s" : ""}…`);
  if (Q.ok) parts.push(`<span style="color:var(--ok)">✓ ${Q.ok} salva${Q.ok > 1 ? "s" : ""}</span>`);
  if (Q.check) parts.push(`<span style="color:var(--warn)">${Q.check} p/ conferir</span>`);
  if (Q.pend) parts.push(`<span style="color:var(--red)">⚠ ${Q.pend} não reconhecida${Q.pend > 1 ? "s" : ""}</span>`);
  el.innerHTML = parts.join(" · ");
  if (!Q.items.length) Q.hideT = setTimeout(() => { Q.ok = Q.pend = Q.check = 0; el.hidden = true; }, 8000);
}
/* quem é o item da etiqueta? (vínculo pela descrição; código de barras ajuda se tiver) */
function identify(ctx){
  const byEan = ctx.ean && [...S.aliases].reverse().find(a => a.ean === ctx.ean);
  const byEanP = byEan && S.products.find(p => p.id === byEan.productId) || (ctx.ean && S.products.find(p => p.barCode === ctx.ean));
  const L = linkMatch(ctx.text, ctx.cid);
  let sure = false;
  if (byEanP) { ctx.chosen = byEanP; sure = true; }
  else if (L.length && L[0].s >= 0.30 && L[0].s >= 1.8 * (L[1]?.s || 0)) { ctx.chosen = L[0].p; sure = true; }
  else if (L.length && L[0].s >= 0.15) ctx.chosen = L[0].p;
  const byName = matchProducts(ctx.text, ctx.cid, null);
  ctx.ranked = [...L.filter(x => x.s >= 0.12), ...byName.filter(x => !L.some(y => y.p === x.p))];
  if (!ctx.chosen && byName.length && byName[0].s >= 0.5) ctx.chosen = byName[0].p;
  return sure;
}
async function processQuick(it){
  const comp = S.competitors.find(c => c.id === it.cid); if (!comp) return;
  let loaded; try { loaded = await fileToImage(it.file); } catch(e) { toast("Não consegui abrir uma foto"); return; }
  const ctx = { cid: it.cid, comp, file: it.file, loaded, fixedProduct: null, chosen: null, text: "", ean: null, price: null, ranked: [] };
  try { Object.assign(ctx, await analyzeTag(it.file, loaded.img, () => {})); } catch(e) { ctx.ocrFailed = true; }
  const sure = !ctx.ocrFailed && identify(ctx);
  if (sure && ctx.price) {
    await commit(ctx, ctx.chosen, ctx.price, ctx.darkUnread);
    Q.ok++; if (ctx.darkUnread) Q.check++;
    toast(`✓ ${ctx.chosen.name}: ${brl(ctx.price)}${ctx.darkUnread ? " · conferir" : ""}`);
  } else {
    await addPending(ctx, sure);
    Q.pend++;
    toast(sure ? `⚠ ${ctx.chosen.name}: não li o preço. Foi para Pendentes.` : "⚠ Não reconheci o item desta foto. Foi para Pendentes.");
  }
  URL.revokeObjectURL(loaded.url);
  refreshResearch();
}

function dropPending(id){ S.pending = S.pending.filter(p => p.id !== id); PhotoDB.del("pend_" + id); save(); }
async function resolvePending(id){
  const p = S.pending.find(x => x.id === id); if (!p) return;
  const comp = S.competitors.find(c => c.id === p.cid);
  if (!comp) { dropPending(id); return pendingScreen(); }
  let blob = null; try { blob = await PhotoDB.get("pend_" + id); } catch(e) {}
  if (!blob) { toast("A foto desta pendência ficou em outro aparelho"); blob = new Blob([""], { type: "image/png" }); }
  let loaded; try { loaded = await fileToImage(blob); } catch(e) { loaded = { img: new Image(), url: "" }; }
  const ctx = { cid: p.cid, comp, file: blob, loaded, fixedProduct: null, chosen: null, text: p.text, ean: p.ean, price: p.price,
    darkUnread: p.darkUnread, ranked: [], pendingId: id };
  identify(ctx);
  if (!ctx.chosen && p.guess) ctx.chosen = S.products.find(x => x.id === p.guess) || null;
  confirmScreen(ctx, p.motivo === "preço" ? "Não consegui ler o preço. Digite o valor e salve." : "Escolha o item desta etiqueta. Depois ele reconhece sozinho.");
}
/* depois de um vínculo novo, tenta resolver sozinho as outras pendências do mesmo concorrente */
async function autoResolvePending(cid){
  for (const p of S.pending.filter(x => x.cid === cid && x.price)) {
    const ctx = { cid, text: p.text, ean: p.ean, ranked: [] };
    if (!identify(ctx)) continue;
    let blob = null; try { blob = await PhotoDB.get("pend_" + p.id); } catch(e) {}
    if (!blob) continue;
    const loaded = await fileToImage(blob);
    Object.assign(ctx, { comp: S.competitors.find(c => c.id === cid), loaded, file: blob });
    await commit(ctx, ctx.chosen, p.price, p.darkUnread);
    dropPending(p.id); URL.revokeObjectURL(loaded.url);
    toast(`✓ Pendência resolvida sozinha: ${ctx.chosen.name}`);
  }
  refreshResearch();
}

/* recorta a região da etiqueta em volta do código de barras (foto de longe) */
function cropAround(img, bc){
  const b = bc.box, sx = img.naturalWidth / bc.w, sy = img.naturalHeight / bc.h;
  const w = b.width * sx, x0 = b.x * sx, y0 = b.y * sy, x1 = x0 + w, y1 = (b.y + b.height) * sy;
  if (w > img.naturalWidth * 0.3) return null;   // a foto já é de perto
  const L = Math.max(0, x0 - 0.8 * w), T = Math.max(0, y0 - 1.8 * w);
  const R = Math.min(img.naturalWidth, x1 + 1.8 * w), B = Math.min(img.naturalHeight, y1 + 0.3 * w);
  const c = document.createElement("canvas"); c.width = R - L; c.height = B - T;
  c.getContext("2d").drawImage(img, L, T, R - L, B - T, 0, 0, R - L, B - T);
  const i2 = new Image(); i2.src = c.toDataURL("image/png");
  return new Promise(r => { i2.onload = () => r(i2); i2.onerror = () => r(null); });
}

/* Lê a etiqueta: código de barras (se tiver) + duas leituras de texto. Devolve texto, menor preço e código */
let ocrUses = 0;
async function analyzeTag(file, img, onStatus){
  const bc = await readBarcode(file);
  onStatus("prep");
  if (ocrUses >= 20 && ocrWorkerP) {   // reinicia o leitor de tempos em tempos (libera memória do celular)
    const old = ocrWorkerP; ocrWorkerP = null; ocrUses = 0;
    old.then(w => w.terminate()).catch(() => {});
  }
  ocrUses++;
  const worker = await getOCR();
  const src = (bc && await cropAround(img, bc)) || img;
  onStatus(1);
  await worker.setParameters({ tessedit_pageseg_mode: "11" });
  const A = (await worker.recognize(imageToCanvas(src, 1000, true, true))).data;
  let B = null; const inv = darkInverted(src);
  if (inv) {   // 2ª leitura: área escura invertida (pega preço branco em fundo preto)
    onStatus(2);
    await worker.setParameters({ tessedit_pageseg_mode: "6" });
    B = (await worker.recognize(inv)).data;
  }
  const text = (A.text || "") + "\n" + (B ? B.text || "" : "");
  const va = findPrices(A.words, A.text).vals, vb = B ? findPrices(B.words, B.text).vals : [];
  const price = lowestPrice([va, vb]);
  // área escura sem preço lido = pode haver um preço menor que o leitor não pegou
  const darkUnread = !!inv && !vb.some(v => price && v <= price);
  return { text, price, darkUnread, ean: (bc && bc.code) || eanFromText(text) };
}

  modal(`<h2>${fixedProduct ? esc(fixedProduct.name) : "Foto da etiqueta"}</h2>
    <p class="sub" style="margin:-8px 0 12px">Concorrente: <b style="color:var(--text)">${esc(comp.name)}</b></p>

    <div class="foot sticky"><button class="btn btn-ghost" data-x>Cancelar</button><button class="btn btn-white" data-man>Digitar o preço</button></div>`,
  m => {
    const st = m.querySelector("[data-st]");
    m.querySelector("[data-x]").onclick = () => { ctx.cancelled = true; URL.revokeObjectURL(loaded.url); close(); };
    m.querySelector("[data-man]").onclick = () => { ctx.cancelled = true; confirmScreen(ctx, "Digite o preço."); };
    ocrLogger = msg => {
      if (ctx.cancelled) return;
      if (msg.status === "recognizing text") st.innerHTML = `<span class="spin"></span> ${ctx.pass === 2 ? "Conferindo preço" : "Lendo etiqueta"}… ${Math.round(msg.progress * 100)}%`;
      else if (/load|initializ/.test(msg.status)) st.innerHTML = `<span class="spin"></span> Preparando leitor (só demora na 1ª vez)…`;
    };
    (async () => {
      try {
        const r = await analyzeTag(file, loaded.img, s => { ctx.pass = s; });
        if (ctx.cancelled) return;
        Object.assign(ctx, r);
      } catch(e) {
        if (ctx.cancelled) return;
        ctx.ocrFailed = true;
      }
      if (ctx.cancelled) return;
      ctx.cancelled = true;   // daqui em diante a tela é trocada
      const sure = fixedProduct ? false : identify(ctx);
      if (!fixedProduct && sure && ctx.price && !ctx.darkUnread) return autoSave(ctx);
      const msg = ctx.ocrFailed ? (navigator.onLine === false ? "Sem internet para o leitor automático. Digite o preço." : "Leitor automático indisponível. Digite o preço.")
        : !ctx.price ? "Não consegui ler o preço. Digite o valor."
        : ctx.darkUnread ? `Li ${brl(ctx.price)}, mas pode ter um preço MENOR na parte escura da etiqueta. Confira.`
        : fixedProduct ? "Confira o preço e salve. A etiqueta fica vinculada a este item."
        : ctx.chosen ? "Confira o item e o preço. Ao salvar, a etiqueta fica vinculada."
        : "Primeira vez desta etiqueta: escolha o seu item. Depois ele reconhece sozinho.";
      confirmScreen(ctx, msg);
    })();
  });
}

/* guarda preço + foto + vínculo; devolve uma função para desfazer */
async function commit(ctx, prod, price, check){
  const { cid } = ctx;
  const prevPrice = priceFor(cid, prod); const prevCopy = prevPrice ? { ...prevPrice } : null;
  const prevLinks = S.links.slice(), prevAliases = S.aliases.slice();
  const k = photoKey(cid, prod.id);
  let prevBlob = null; const prevStamp = S.photos[k];
  try {
    if (prevStamp) prevBlob = await PhotoDB.get(k);
    if (prevStamp && !prevBlob && CLOUD) prevBlob = await Cloud.getPhoto(k);
  } catch(e) {}
  setPrice(cid, prod, price, check);
  if ((ctx.text || "").trim()) rememberLink(cid, ctx.text, prod.id);
  if (ctx.ean && prod.barCode !== ctx.ean) rememberAlias(cid, "", prod.id, ctx.ean);
  save();   // grava o preço na hora
  try {     // guarda a foto nova no lugar da antiga
    const blob = await canvasToBlob(imageToCanvas(ctx.loaded.img, 1280, false), 0.72);
    await PhotoDB.put(k, blob); S.photos[k] = Date.now();
    uploadPhoto(k, blob);
  } catch(e) { toast("Preço salvo, mas a foto não pôde ser guardada"); }
  save();
  return async () => {   // desfazer
    if (prevCopy) Object.assign(priceFor(cid, prod) || {}, prevCopy);
    else S.prices = S.prices.filter(p => !(p.competitorId === cid && p.productId === prod.id));
    S.links = prevLinks; S.aliases = prevAliases;
    if (prevBlob) { await PhotoDB.put(k, prevBlob); S.photos[k] = prevStamp; uploadPhoto(k, prevBlob); } else removePhoto(cid, prod.id);
    save();
  };
}

/* tela para conferir/escolher item e preço */
function confirmScreen(ctx, message){
  const { cid, comp, loaded, fixedProduct } = ctx;
  modal(`<h2>${fixedProduct ? esc(fixedProduct.name) : "Foto da etiqueta"}</h2>
    <p class="sub" style="margin:-8px 0 12px">Concorrente: <b style="color:var(--text)">${esc(comp.name)}</b></p>
    <img class="big-photo" style="max-height:24vh" src="${loaded.url}" alt="Foto da etiqueta">
    <div class="status ${ctx.price && !ctx.darkUnread ? "ok" : "warn"}">${esc(message)}</div>
    <div class="field" style="margin-top:14px"><label>Preço (o menor da etiqueta)</label><input inputmode="numeric" autocomplete="off" data-p></div>
    ${fixedProduct ? "" : `
      <div class="field" style="margin-top:6px"><label>Meu item</label><input type="search" data-q placeholder="Buscar o item"></div>
      <div class="choices" data-c></div>`}
    <div class="foot sticky">
      <button class="btn btn-ghost" data-x>${ctx.pendingId ? "Voltar" : "Cancelar"}</button>
      ${fixedProduct || ctx.pendingId ? "" : `<button class="btn btn-white" data-next>${IC.camera} Salvar + próx.</button>`}
      <button class="btn btn-orange" data-ok>Salvar</button>
    </div>`,
  m => {
    const pIn = m.querySelector("[data-p]");
    const pi = bindPriceInput(pIn, Math.round((ctx.price || 0) * 100), () => doSave(false));
    const q = m.querySelector("[data-q]"), box = m.querySelector("[data-c]");
    const draw = () => {
      if (!box) return;
      const nq = norm(q.value.trim());
      let list = nq ? [...S.products].sort(byName).filter(p => norm(p.name).includes(nq) || p.barCode.includes(nq))
                    : ctx.ranked.slice(0, 4).map(r => r.p);
      if (ctx.chosen && !list.includes(ctx.chosen)) list = [ctx.chosen, ...list];
      list = list.slice(0, nq ? 8 : 4);
      box.innerHTML = list.length ? list.map(p => {
        const pr = priceFor(cid, p);
        return `<button class="choice ${ctx.chosen === p ? "on" : ""}" data-id="${p.id}"><span>${esc(p.name)}</span>${pr && pr.price > 0 ? `<small>atual ${brl(pr.price)}</small>` : ""}</button>`;
      }).join("") : `<p class="hint">Busque o seu item acima e toque nele.</p>`;
    };
    if (box) {
      box.onclick = e => { const b = e.target.closest("[data-id]"); if (!b) return; ctx.chosen = S.products.find(p => p.id === +b.dataset.id); draw(); };
      q.oninput = draw; draw();
    }
    const doSave = async (next) => {
      if (!ctx.chosen) { toast("Escolha o seu item"); q && q.focus(); return; }
      const price = pi.value();
      if (!(price > 0)) { toast("Informe o preço"); pIn.focus(); return; }
      const mine = layer.firstChild;
      if (next) { camTarget = null; camCid = cid; cam.value = ""; cam.click(); }   // abre a câmera já, no toque
      await commit(ctx, ctx.chosen, price, false);
      URL.revokeObjectURL(loaded.url);
      if (ctx.pendingId) dropPending(ctx.pendingId);
      if (layer.firstChild === mine) close();
      render(); toast(`${ctx.chosen.name}: ${brl(price)}`);
      if (S.pending.some(p => p.cid === cid)) {
        await autoResolvePending(cid);
        if (ctx.pendingId && S.pending.some(p => p.cid === cid)) pendingScreen();
      }
    };
    m.querySelector("[data-x]").onclick = () => { URL.revokeObjectURL(loaded.url); close(); if (ctx.pendingId) pendingScreen(); };
    m.querySelector("[data-ok]").onclick = () => doSave(false);
    const nx = m.querySelector("[data-next]"); if (nx) nx.onclick = () => doSave(true);
  });
}

/* sugere a posição do item novo: depois do último item parecido (mesmo tipo/categoria) */
function suggestPosition(name){
  const words = norm(name).split(/[^a-z0-9]+/).filter(w => w.length >= 2);
  if (!words.length) return -1;
  let bestScore = 0, bestIdx = -1;
  S.products.forEach((p, i) => {
    const pw = norm(p.name).split(/[^a-z0-9]+/);
    let s = 0;
    for (let k = 0; k < Math.min(words.length, pw.length); k++) { if (words[k] === pw[k]) s += 3 - Math.min(k, 2) * 0.5; else break; }   // começo igual pesa mais
    for (const w of words) if (w.length >= 3 && pw.includes(w)) s += 0.5;
    if (s >= bestScore && s > 0) { bestScore = s; bestIdx = i; }   // ">=": fica depois do ÚLTIMO parecido
  });
  return bestScore >= 3 ? bestIdx : -1;
}
function newProductDialog(){
  modal(`<h2>Novo produto</h2>
    <form data-f>
      <div class="field"><label>Nome</label><input data-n maxlength="120" placeholder="Ex.: FEIJÃO PRETO KICALDO 1KG"></div>
      <div class="field" style="margin-top:18px"><label>Código de barras (opcional)</label><input data-b inputmode="numeric" maxlength="14"></div>
      <div class="field" style="margin-top:18px"><label>Colocar depois de</label>
        <select data-pos><option value="-1">No fim da lista</option><option value="start">No começo da lista</option>
          ${S.products.map((p, i) => `<option value="${i}">${esc(p.name)}</option>`).join("")}</select><span class="chev">${IC.chev}</span></div>
      <p class="hint" data-hint style="margin-top:-4px">Digite o nome: eu coloco perto dos parecidos.</p>
      <div class="foot"><button type="button" class="btn btn-ghost" data-x>Cancelar</button><button class="btn btn-orange">Salvar</button></div>
    </form>`,
  m => {
    m.querySelector("[data-x]").onclick = close;
    const b = m.querySelector("[data-b]"); b.oninput = () => { b.value = b.value.replace(/\D/g, ""); };
    const n = m.querySelector("[data-n]"), pos = m.querySelector("[data-pos]"), hint = m.querySelector("[data-hint]");
    let touched = false;
    pos.onchange = () => { touched = true; hint.textContent = "Posição escolhida por você."; };
    n.oninput = () => {
      if (touched) return;
      const i = suggestPosition(n.value);
      pos.value = String(i);
      hint.textContent = i >= 0 ? "Sugestão: junto dos parecidos. Pode trocar acima." : "Não achei parecidos: vai para o fim. Pode trocar acima.";
    };
    m.querySelector("[data-f]").onsubmit = e => {
      e.preventDefault();
      const name = cleanText(n.value, 120).toUpperCase();
      if (!name) return;
      if (S.products.some(p => norm(p.name) === norm(name))) { toast("Esse produto já está na lista"); return; }
      const item = { id: newId(), name, barCode: digits(b.value) };
      const v = pos.value;
      const anchor = +v >= 0 ? S.products[+v] : null;   // item que fica antes do novo
      if (v === "start") S.products.unshift(item);
      else if (+v >= 0) S.products.splice(+v + 1, 0, item);
      else S.products.push(item);
      for (const k of Object.keys(S.orders)) {   // nos concorrentes com ordem própria: depois do mesmo vizinho
        const o = S.orders[k], i = anchor ? o.indexOf(anchor.id) : -1;
        if (v === "start") o.unshift(item.id); else if (i >= 0) o.splice(i + 1, 0, item.id); else o.push(item.id);
      }
      save(); close(); render(); toast("Produto adicionado");
    };
  });
}

    <div class="topbar">

    <div class="row" style="margin-bottom:10px">

        <span style="flex:1;min-width:0"><span class="pname" style="font-size:15px;display:block;margin:0 0 2px">${esc(p.name)}</span>
        <span class="stamp">preço atual: <b style="color:var(--primary)">${brl(pr.price)}</b> de ${dayLabel(pr.priceAt || pr.updatedAt)}</span></span></label>`; }).join("")}</div>
    <div class="selbar">
      <button class="btn btn-ghost" id="cancelSel2">Cancelar</button>

  const upd = () => { app.querySelector("#cnt").textContent = n(); app.querySelector("#okSel").disabled = !n(); };
  const exit = () => { selecting = null; render(); window.scrollTo(0, 0); };

  app.querySelector("#all").onclick = () => { withPrice.forEach(p => selecting.add(p.id)); app.querySelectorAll("[data-chk]").forEach(x => x.checked = true); upd(); };

  upd();

/* ---------- organizar a ordem dos itens: geral (cid = null) ou de um concorrente ---------- */
function renderOrganize(cid){
  const comp = cid && S.competitors.find(c => c.id === cid);
  if (cid && !comp) { organizing = false; return render(); }
  const own = comp && !!S.orders[cid];
  app.onclick = null;
  app.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" style="color:var(--primary)" id="done1" aria-label="Voltar">${IC.back}</button>
      <h1>${comp ? "Ordem: " + esc(comp.name) : "Meus itens"}</h1>
      <button class="btn btn-orange" id="done2" style="padding:9px 16px">Pronto</button>
    </div>
    <div class="ordbox ${comp ? "ordc" : ""}">${comp
      ? (own ? `Esta é a ordem <b>só do ${esc(comp.name)}</b>. Os outros concorrentes não mudam.`
             : `Hoje o ${esc(comp.name)} usa a <b>ordem geral</b>. Ao mudar algo aqui, ele passa a ter <b>ordem própria</b>.`)
      : `Esta é a <b>ordem geral</b>: vale para concorrentes sem ordem própria e para o Excel.`}</div>
    <p class="hint" style="margin:0 0 8px">Arraste pelo <b>☰</b> ou use <b>▲ ▼</b> para mudar a ordem. <b>Toque no nome</b> para editar ou excluir o item.</p>
    <div class="row" style="margin-bottom:10px">
      <button class="btn btn-white" id="grp">🧺 Juntar parecidos</button>
      <button class="btn btn-white" id="addP2">+ Produto</button>
    </div>
    ${own ? `<button class="btn btn-ghost" id="reset" style="width:100%;margin:-4px 0 8px;color:var(--red)">↺ Voltar para a ordem geral</button>` : ""}
    <div id="olist">${productsFor(cid).map(p => `<div class="orow" data-id="${p.id}">
      <span class="handle" aria-label="Arrastar">☰</span>
      <span class="oname" role="button">${esc(p.name)}<small>${p.barCode ? esc(p.barCode) : "sem código"} · editar</small></span>
      <button class="obtn" data-up aria-label="Subir">▲</button><button class="obtn" data-dn aria-label="Descer">▼</button>
    </div>`).join("")}</div>`;
  const olist = app.querySelector("#olist");
  let firstChange = !own;
  const apply = () => {
    const ids = [...olist.children].map(r => +r.dataset.id);
    if (comp) {
      S.orders[cid] = ids; save();
      if (firstChange) { firstChange = false; const box = app.querySelector(".ordbox"); if (box) box.innerHTML = `Esta é a ordem <b>só do ${esc(comp.name)}</b>. Os outros concorrentes não mudam.`; }
      return;
    }
    const map = new Map(S.products.map(p => [p.id, p]));
    S.products = ids.map(id => map.get(id)).filter(Boolean).concat(S.products.filter(p => !ids.includes(p.id)));
    save();
  };
  const done = () => { organizing = false; render(); window.scrollTo(0, 0); toast("Ordem salva"); };
  app.querySelector("#done1").onclick = done; app.querySelector("#done2").onclick = done;
  app.querySelector("#addP2").onclick = newProductDialog;
  app.querySelector("#grp").onclick = () => confirmBox("Juntar parecidos", "Colocar juntos os itens do mesmo tipo (arroz com arroz, feijão com feijão…)? A ordem dentro de cada tipo é mantida.", "Juntar", () => {
    if (comp) S.orders[cid] = groupedProducts(productsFor(cid)).map(p => p.id);
    else S.products = groupedProducts();
    save(); render(); toast("Itens parecidos agrupados");
  });
  const rs = app.querySelector("#reset");
  if (rs) rs.onclick = () => confirmBox("Ordem geral", `O ${comp.name} volta a usar a ordem geral? A ordem própria dele será apagada.`, "Voltar", () => {
    delete S.orders[cid]; save(); render(); toast("Usando a ordem geral");
  });
  olist.onclick = e => {
    const row = e.target.closest(".orow"); if (!row) return;
    if (e.target.closest(".oname")) { const prod = S.products.find(p => p.id === +row.dataset.id); if (prod) editProductDialog(prod); return; }
    if (e.target.closest("[data-up]") && row.previousElementSibling) olist.insertBefore(row, row.previousElementSibling);
    else if (e.target.closest("[data-dn]") && row.nextElementSibling) olist.insertBefore(row.nextElementSibling, row);
    else return;
    row.classList.add("moved"); setTimeout(() => row.classList.remove("moved"), 400);
    apply();
  };
  olist.addEventListener("pointerdown", e => {
    const h = e.target.closest(".handle"); if (!h) return;
    e.preventDefault();
    const row = h.closest(".orow"); row.classList.add("drag");
    const startY = e.clientY, startScroll = window.scrollY;
    let lastY = e.clientY, before = undefined, scrollT = null;
    const mark = () => {
      row.style.transform = `translateY(${lastY - startY + window.scrollY - startScroll}px)`;
      const rows = [...olist.children].filter(r => r !== row);
      before = null;
      for (const r of rows) { const bx = r.getBoundingClientRect(); if (lastY < bx.top + bx.height / 2) { before = r; break; } }
      rows.forEach(r => r.classList.remove("drop-before", "drop-after"));
      if (before) before.classList.add("drop-before"); else if (rows.length) rows[rows.length - 1].classList.add("drop-after");
    };
    const move = ev => {
      lastY = ev.clientY; mark();
      clearInterval(scrollT);
      if (lastY < 90 || lastY > innerHeight - 110) scrollT = setInterval(() => { window.scrollBy(0, lastY < 90 ? -14 : 14); mark(); }, 30);
    };
    const up = ev => {
      clearInterval(scrollT);
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
      row.classList.remove("drag"); row.style.transform = "";
      olist.querySelectorAll(".drop-before,.drop-after").forEach(r => r.classList.remove("drop-before", "drop-after"));
      if (ev.type === "pointerup" && before !== undefined && before !== row.nextElementSibling) {
        olist.insertBefore(row, before);
        row.classList.add("moved"); setTimeout(() => row.classList.remove("moved"), 500);
        apply();
      }
    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
  });
}

async function enterUser(name){

/* dados do site antigo (antes de ter usuários) neste aparelho */
function offerLegacy(){
  const raw = lsGet(LEGACY_KEY); if (!raw) return;
  let old; try { old = normalizeState(JSON.parse(raw)); } catch(e) { return; }
  if (!old.prices.length && !old.competitors.length) { lsDel(LEGACY_KEY); return; }
  modal(`<h2>Trazer a pesquisa deste celular?</h2>
    <p class="sub">Encontrei neste aparelho uma pesquisa feita antes dos usuários: ${old.competitors.length} concorrente(s) e ${old.prices.length} preço(s).
    Quer colocar no usuário <b>${esc(USER)}</b>? Isso substitui o que esse usuário tiver hoje.</p>
    <div class="foot"><button class="btn btn-ghost" data-n>Agora não</button><button class="btn btn-orange" data-y>Trazer</button></div>`,
  m => {
    m.querySelector("[data-n]").onclick = close;
    m.querySelector("[data-y]").onclick = async () => {
      close(); S = old;
      for (const k of Object.keys(S.photos)) {   // fotos antigas -> usuário (e nuvem)
        try { const b = await PhotoDB.getRaw(k); if (b) { await PhotoDB.put(k, b); uploadPhoto(k, b); } else delete S.photos[k]; } catch(e) {}
      }
      lsSet(LEGACY_KEY + ":importado", raw); lsDel(LEGACY_KEY);
      save(); render(); toast("Pesquisa trazida para " + USER);
    };
  });
}

      <div class="field"><label>E-mail</label><input id="le" type="email" inputmode="email" autocomplete="username" maxlength="120" required></div>
      <div class="field" style="margin-top:18px"><label>Senha</label><input id="lp" type="password" autocomplete="current-password" maxlength="72" required></div>
      <button class="btn btn-orange" id="lb" style="width:100%;margin-top:4px">Entrar</button>
    </form>
    <button class="btn btn-ghost" id="forgot" style="width:100%;margin-top:10px;color:var(--primary)">Esqueci minha senha</button>
    <p class="hint" style="text-align:center;margin-top:18px">Não tem acesso? Peça para a responsável cadastrar o seu e-mail.</p>`;
  const le = app.querySelector("#le"), lp = app.querySelector("#lp"), lb = app.querySelector("#lb");
  const last = lsGet("dscanner-ultimo-email"); if (last) le.value = last;
  app.querySelector("#lf").onsubmit = async e => {
    e.preventDefault();
    if (Date.now() < loginBlockedUntil) return toast(`Muitas tentativas. Aguarde ${Math.ceil((loginBlockedUntil - Date.now()) / 1000)} segundos.`);
    const email = le.value.trim().toLowerCase(), pw = lp.value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast("Digite um e-mail válido");
    if (!pw) return toast("Digite a senha");
    lb.disabled = true; lb.textContent = "Entrando…";
    try {
      await Auth.signIn(email, pw);
      loginFails = 0; lsSet("dscanner-ultimo-email", email);
      document.querySelectorAll(".toast").forEach(x => x.remove());
      enterAccount();
    } catch(err) {
      loginFails++;
      if (loginFails >= 5) { loginBlockedUntil = Date.now() + 30000; loginFails = 0; }
      toast(navigator.onLine === false ? "Sem internet. Conecte para entrar." : err.message);
      lb.disabled = false; lb.textContent = "Entrar"; lp.value = ""; lp.focus();
    }
  };
  app.querySelector("#forgot").onclick = () => forgotDialog(le.value.trim().toLowerCase());
}
function forgotDialog(email){
  modal(`<h2>Esqueci minha senha</h2>
    <p class="sub" style="margin-top:-6px">Digite o e-mail cadastrado. Vamos mandar um link para você criar uma senha nova.</p>
    <form data-f><div class="field"><label>E-mail</label><input data-e type="email" inputmode="email" maxlength="120" value="${esc(email || "")}"></div>
    <div class="foot"><button type="button" class="btn btn-ghost" data-x>Cancelar</button><button class="btn btn-orange">Enviar link</button></div></form>`,
  m => {
    m.querySelector("[data-x]").onclick = close;
    m.querySelector("[data-f]").onsubmit = async e => {
      e.preventDefault();
      const em = m.querySelector("[data-e]").value.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return toast("Digite um e-mail válido");
      try { await Auth.recover(em); } catch(err) {}
      close();
      modal(`<h2>Confira o seu e-mail</h2>
        <p class="sub">Se <b>${esc(em)}</b> estiver cadastrado, você vai receber em alguns minutos um link para criar uma senha nova. Veja também a caixa de spam.</p>
        <p class="sub">Abra o link <b>neste mesmo aparelho</b>.</p>
        <div class="foot"><button class="btn btn-orange" data-x>Entendi</button></div>`, m2 => { m2.querySelector("[data-x]").onclick = close; });
    };
  });
}
function newPasswordScreen(){
  nav.style.display = "none"; app.onclick = null; close();
  app.innerHTML = `
    <h1 style="margin-top:12px">CRIAR SENHA NOVA</h1>
    <p class="sub" style="margin:0 0 18px">Conta: <b>${esc(SESSION.user.email)}</b></p>
    <form id="pf">
      <div class="field"><label>Senha nova (mínimo 8 caracteres)</label><input id="p1" type="password" autocomplete="new-password" maxlength="72"></div>
      <div class="field" style="margin-top:18px"><label>Repita a senha nova</label><input id="p2" type="password" autocomplete="new-password" maxlength="72"></div>
      <button class="btn btn-orange" id="pb" style="width:100%">Salvar senha</button>
    </form>`;
  app.querySelector("#pf").onsubmit = async e => {
    e.preventDefault();
    const a = app.querySelector("#p1").value, b = app.querySelector("#p2").value;
    if (a.length < 8 || !/[A-Za-z]/.test(a) || !/\d/.test(a)) return toast("Use pelo menos 8 caracteres, com letras e números");
    if (a !== b) return toast("As duas senhas não são iguais");
    const pb = app.querySelector("#pb"); pb.disabled = true;
    try { await Auth.setPassword(a); toast("Senha nova salva!"); enterAccount(); }
    catch(err) { pb.disabled = false; toast(err.message); }
  };
}
/* link do e-mail ("esqueci minha senha"): chega com #access_token=…&type=recovery */
function handleAuthRedirect(){
  const h = location.hash.slice(1);
  if (!/(^|&)(access_token|error)=/.test(h)) return false;
  const p = new URLSearchParams(h);
  history.replaceState(null, "", location.pathname + "#pesquisa");
  if (p.get("error")) { loginScreen("O link expirou ou já foi usado. Peça um novo em \"Esqueci minha senha\"."); return true; }
  const at = p.get("access_token"), rt = p.get("refresh_token"), type = p.get("type");
  (async () => {
    try {
      const user = await Auth.userFromToken(at);
      Auth.store({ access_token: at, refresh_token: rt, expires_in: num(p.get("expires_in")) || 3600, user });
      if (type === "recovery" || type === "invite") newPasswordScreen(); else enterAccount();
    } catch(e) { loginScreen("O link expirou ou já foi usado. Peça um novo em \"Esqueci minha senha\"."); }
  })();
  return true;
}
async function enterAccount(){
  USER = SESSION.user.email; UKEY = SESSION.user.id;
  nav.style.display = ""; openCompetitorId = null; query = ""; close();
  const local = loadLocal();
  S = local || normalizeState(blankState());
  if (location.hash !== "#pesquisa") history.replaceState(null, "", "#pesquisa");
  render(); setSync("wait");
  try {
    const row = await Cloud.load();
    if (UKEY !== SESSION?.user?.id) return;
    const pending = lsGet(pendKey());
    if (row && row.dados && !(pending && local)) { S = normalizeState(row.dados); lsSet(stateKey(), JSON.stringify(S)); render(); setSync("ok"); }
    else { lsSet(pendKey(), "1"); await push(); }
  } catch(e) {
    if (e && e.expired) return sessionExpired();
    setSync("off");
  }
  offerImport();
  if (S.selectedCompetitorId) warmOCR();
}
function sessionExpired(){
  Auth.signOut();
  loginScreen("Sua sessão expirou. Entre de novo (nada do que você fez neste aparelho foi perdido).");
}
async function logout(){
  confirmBox("Sair da conta", `Sair da conta ${USER}? Seus dados continuam salvos na nuvem.`, "Sair", async () => {
    clearTimeout(pushTimer);
    if (lsGet(pendKey())) { await push(); if (lsGet(pendKey())) return toast("Há alterações ainda não enviadas. Conecte à internet e tente de novo."); }
    await Auth.signOut(); loginScreen();
  });
}
/* dados que já estavam neste aparelho (antes do login): oferece trazer para a conta, uma vez */
function offerImport(){
  const doneKey = "dscanner-importacao-vista:" + UKEY;
  if (lsGet(doneKey)) return;
  const cands = [];
  const legacy = lsGet(LEGACY_KEY); if (legacy) cands.push({ label: "Pesquisa antiga (antes dos usuários)", key: LEGACY_KEY, prefix: "" });
  for (const n of knownUsers()) { const k = "dscanner-dados:" + slug(n); if (lsGet(k)) cands.push({ label: "Usuário " + n, key: k, prefix: slug(n) + "|" }); }
  const ok = cands.map(c => { try { const s = normalizeState(JSON.parse(lsGet(c.key))); return s.prices.length || s.competitors.length ? { ...c, s } : null; } catch(e) { return null; } }).filter(Boolean);
  if (!ok.length) { lsSet(doneKey, "1"); return; }
  modal(`<h2>Trazer pesquisa deste aparelho?</h2>
    <p class="sub" style="margin-top:-6px">Encontrei neste aparelho pesquisas feitas antes do login. Escolha uma para colocar na sua conta <b>${esc(USER)}</b> (substitui o que a conta tiver hoje):</p>
    <div class="list" style="margin-top:8px">${ok.map((c, i) => `<button class="ubtn" data-i="${i}" style="font-size:15px">${esc(c.label)}<small style="display:block;font-weight:400;color:var(--muted)">${c.s.competitors.length} concorrente(s) · ${c.s.prices.length} preço(s)</small></button>`).join("")}</div>
    <div class="foot"><button class="btn btn-ghost" data-n>Agora não</button></div>`,
  m => {
    m.querySelector("[data-n]").onclick = () => { lsSet(doneKey, "1"); close(); };
    m.onclick = async e => {
      const b = e.target.closest("[data-i]"); if (!b) return;
      const c = ok[+b.dataset.i]; close(); S = c.s;
      for (const k of Object.keys(S.photos)) {   // fotos antigas -> conta (e nuvem)
        try { const bl = await PhotoDB.getRaw(c.prefix + k); if (bl) { await PhotoDB.put(k, bl); uploadPhoto(k, bl); } else delete S.photos[k]; } catch(err) {}
      }
      lsSet(c.key + ":importado", lsGet(c.key)); lsDel(c.key); lsSet(doneKey, "1");
      save(); render(); toast("Pesquisa trazida para a sua conta");
    };
  });
}


/* ---------- instalar no celular (ícone na tela inicial) ---------- */
const Instala = (() => {
  const KEY = "dscanner-instala-adiado", DIAS = 7;
  let evt = null;
  const instalado = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const ehIphone = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const adiado = () => { const t = +(lsGet(KEY) || 0); return t && Date.now() - t < DIAS * 864e5; };
  function fechar(adiar){ document.querySelectorAll(".instala").forEach(x => x.remove()); if (adiar) lsSet(KEY, String(Date.now())); }
  function mostrar(){
    if (instalado() || adiado() || document.querySelector(".instala")) return;
    const iphone = ehIphone() && !evt;
    if (!evt && !iphone) return;
    const d = document.createElement("div"); d.className = "instala";
    d.innerHTML = `<img src="icone-192.png" alt="">
      <div class="tx"><b>Instalar Pesquisa de Preços</b>${iphone
        ? `No Safari, toque em <b style="display:inline;font-size:14px">Compartilhar</b> <span aria-hidden="true">(□↑)</span> e depois em <b style="display:inline;font-size:14px">Adicionar à Tela de Início</b>.`
        : `Coloque o ícone na tela do celular e abra como aplicativo.`}</div>
      <div class="bt">${iphone ? "" : `<button class="btn btn-orange" data-i>Instalar</button>`}<button class="btn btn-ghost" data-n>${iphone ? "Entendi" : "Agora não"}</button></div>`;
    document.body.appendChild(d);
    d.querySelector("[data-n]").onclick = () => fechar(true);
    const bi = d.querySelector("[data-i]");
    if (bi) bi.onclick = async () => { const e = evt; evt = null; fechar(false); if (!e) return; e.prompt(); try { const r = await e.userChoice; if (r && r.outcome !== "accepted") lsSet(KEY, String(Date.now())); } catch(err) {} };
  }
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); evt = e; setTimeout(mostrar, 1500); });
  window.addEventListener("appinstalled", () => { evt = null; fechar(false); toast("Instalado! Procure o ícone na tela do celular"); });
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
  setTimeout(mostrar, 3000);   // iPhone não tem o aviso automático: mostra o passo a passo
  return { mostrar };
})();

window.addEventListener("hashchange", () => { if (CLOUD && handleAuthRedirect()) return; if (!USER) return CLOUD ? (SESSION ? null : loginScreen()) : userScreen(); openCompetitorId = null; organizing = false; selecting = null; app.onclick = null; render(); window.scrollTo(0,0); });
(function boot(){
  if (CLOUD) {
    if (handleAuthRedirect()) return;          // veio do link do e-mail (senha nova)
    if (Auth.load()) return enterAccount();     // já entrou antes neste aparelho
    return loginScreen();
  }
  const u = lsGet(USER_KEY);                    // sem nuvem: usuários só neste aparelho
  if (u) enterUser(u); else userScreen();
})();
</script>
