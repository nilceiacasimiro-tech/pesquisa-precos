<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#003399">
<title>DScanner – Pesquisa de Preço</title>
<style>
  :root{
    --bg:#FFFFFF; --card:#FFFFFF; --card2:#F5F8FD; --primary:#003399; --primary-dark:#002270; --primary-soft:#E6ECF8;
    --text:#1B2433; --muted:#6B7685; --red:#D32F2F; --line:#DCE3EE; --ok:#2E7D32; --warn:#E65100; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px}
  input{font:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
  h1{color:var(--primary);font-size:22px;margin:4px 0 14px;letter-spacing:.5px}
  .field{position:relative;margin-bottom:12px}
  .field label{position:absolute;left:12px;top:-8px;background:var(--bg);padding:0 6px;font-size:12px;color:var(--muted)}
  .field input,.field select{width:100%;padding:14px 12px;background:#fff;color:var(--text);
    border:1px solid #C5CFDD;border-radius:8px;outline:none;font-size:16px;appearance:none}
  .field select option{background:var(--card);color:var(--text)}
  .field input:focus,.field select:focus{border-color:var(--primary)}
  .field:focus-within label{color:var(--primary)}
  .field .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .btn{padding:12px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn-orange{background:var(--primary);color:#fff}
  .btn-orange:active{background:var(--primary-dark)}
  .btn-white{background:var(--primary-soft);color:var(--primary)}
  .btn-ghost{background:transparent;color:var(--muted)}
  .btn-ghost:hover{color:var(--primary)}
  .btn-red{background:var(--red);color:#fff}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .icon-btn{background:transparent;padding:8px;border-radius:50%;display:inline-flex}
  .icon-btn:hover{background:#0f172a0d}
  svg.i{width:22px;height:22px;fill:currentColor}
  .list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
  .card{background:var(--card);border-radius:var(--radius);padding:14px;border:1px solid var(--line);box-shadow:0 2px 6px #0f172a0f}
  .card.alt{background:var(--card2)}
  .pname{font-weight:700;font-size:16px;margin:0 0 10px}
  .actions{display:flex;justify-content:space-between;gap:8px}
  .price{color:var(--primary);font-weight:700;font-size:18px;text-align:right;margin-top:12px}
  .price.empty{color:var(--muted);font-weight:500;font-size:15px}
  .sub{color:var(--muted);font-size:14px}
  .hint{color:var(--muted);font-size:14px;margin:6px 2px 0}
  .empty-state{color:var(--muted);text-align:center;padding:48px 12px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .head h1{margin:0}
  .comp{display:flex;align-items:center;gap:8px}
  .comp .cname{flex:1;font-size:19px;font-weight:700;background:none;color:var(--text);text-align:left;padding:4px 0}
  .comp .count{color:var(--primary);font-size:13px;white-space:nowrap}
  .topbar{display:flex;align-items:center;gap:6px;margin:-4px 0 8px}
  .topbar h1{flex:1;margin:0;color:var(--text);font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{color:var(--primary);font-weight:700;font-size:14px;white-space:nowrap}
  nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -2px 8px #0f172a0f;border-top:1px solid var(--line);
    display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
  nav.bottom a{flex:1;max-width:240px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;
    color:var(--muted);text-decoration:none;font-size:12px}
  nav.bottom a.on{color:var(--primary)}
  .fab{position:fixed;right:20px;bottom:84px;width:56px;height:56px;border-radius:16px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px #00339966}
  /* modal */
  .scrim{position:fixed;inset:0;background:#0f172a80;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal{background:var(--bg);border:1px solid var(--line);box-shadow:0 10px 30px #0f172a33;border-radius:16px;width:100%;max-width:420px;padding:20px;max-height:90vh;overflow:auto}
  .modal h2{margin:0 0 16px;font-size:19px}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
  .barcode-box{background:#fff;border-radius:8px;padding:16px 10px;display:flex;justify-content:center}
  .barcode-box svg{width:100%;max-width:340px;height:auto}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;
    border-radius:10px;font-size:14px;z-index:30;max-width:90vw;text-align:center;box-shadow:0 4px 12px #0f172a40}
  .menu-sep{height:1px;background:var(--line);margin:18px 0}
  .small-links{display:flex;gap:16px;justify-content:center;margin-top:28px;flex-wrap:wrap}
  .small-links button{background:none;color:var(--muted);text-decoration:underline;font-size:14px}
  .modal .foot.sticky{position:sticky;bottom:-20px;background:var(--bg);margin:14px -20px -20px;padding:12px 20px 16px;border-top:1px solid var(--line);flex-wrap:nowrap}
  .modal .foot.sticky .btn{flex:1;padding:13px 8px;white-space:nowrap}
  .modal .foot.sticky .btn-ghost{flex:0 0 auto}
  .big-photo{width:100%;max-height:42vh;object-fit:contain;border-radius:10px;background:#EEF2F7;display:block}
  .status{margin-top:10px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .status.ok{color:var(--ok)}.status.warn{color:var(--warn);font-weight:600}
  .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .choices{display:flex;flex-direction:column;gap:6px;margin-top:-4px}
  .choice{background:var(--card);color:var(--text);text-align:left;padding:10px 12px;border:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
  .choice small{color:var(--muted);white-space:nowrap}
  .choice.on{border-color:var(--primary);background:var(--primary-soft);font-weight:600}
  .btn-cam{width:100%;margin-top:4px;padding:16px;font-size:17px}
  .ptop{display:flex;gap:10px;align-items:flex-start}
  .ptop .pname{flex:1}
  .thumb{width:54px;height:54px;border-radius:8px;overflow:hidden;flex:none;background:#EEF2F7;padding:0;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .actions .btn{padding:11px 10px}
  .actions .grow{flex:1}
  .stamp{color:var(--muted);font-size:12px;font-weight:400}
  .done{text-align:center;color:var(--ok);font-size:22px;font-weight:700;margin:2px 0 4px}
  .big-price{font-size:28px;font-weight:700;color:var(--primary);text-align:center;margin:4px 0 10px}
</style>
</head>

/* ---------- armazenamento ---------- */
let memoryStore = null;
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e) { raw = memoryStore; }
  if (raw) { try { return JSON.parse(raw); } catch(e) {} }
  let id = 1;
  return {
    nextId: DEFAULT_PRODUCTS.length + 1,
    products: DEFAULT_PRODUCTS.map(p => ({ id: id++, name: p.name, barCode: p.barCode })),
    competitors: [],           // {id, name}
    prices: [],                // {id, competitorId, productId, name, barCode, price}
    selectedCompetitorId: null
  };
}
function save(){
  const raw = JSON.stringify(S);
  try { localStorage.setItem(KEY, raw); } catch(e) { memoryStore = raw; }
}
let S = load();
const newId = () => S.nextId++;

/* ---------- utilidades ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => "R$ " + Number(v).toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const byName = (a,b) => a.name.localeCompare(b.name, "pt-BR");
function toast(msg){
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
function priceFor(competitorId, product){
  return S.prices.find(p => p.competitorId === competitorId &&
    (p.productId === product.id || (p.productId == null && p.name === product.name)));
}
const pricesOf = cid => S.prices.filter(p => p.competitorId === cid).sort(byName);

/* ---------- EAN-13 (mesma lógica do app) ---------- */
function ean13Check(d12){
  let sum = 0;
  for (let i = 0; i < 12; i++) sum += (+d12[i]) * (i % 2 ? 3 : 1);
  return String((10 - sum % 10) % 10);
}
function sanitizeEAN13(code){
  if (!/^\d{13}$/.test(code)) return null;
  return code.slice(0,12) + ean13Check(code.slice(0,12));
}
function ean13SVG(code){
  const L = ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
  const G = ["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];
  const R = L.map(p => p.replace(/./g, b => b === "0" ? "1" : "0"));
  const PAR = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
  const par = PAR[+code[0]];
  let bits = "101";
  for (let i = 1; i <= 6; i++) bits += (par[i-1] === "L" ? L : G)[+code[i]];
  bits += "01010";
  for (let i = 7; i <= 12; i++) bits += R[+code[i]];
  bits += "101";
  const m = 3, q = 11 * m, h = 70, guardH = 78, W = bits.length * m + 2 * q;
  const guards = new Set([0,1,2,45,46,47,48,49,92,93,94]);
  let rects = "";
  for (let i = 0; i < bits.length; i++) if (bits[i] === "1")
    rects += `<rect x="${q + i*m}" y="4" width="${m}" height="${guards.has(i) ? guardH : h}"/>`;
  const t = (x, s) => `<text x="${x}" y="96" font-family="monospace" font-size="16" text-anchor="middle">${s}</text>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} 102">${rects}` +
    t(q - 10, code[0]) + t(q + 24*m, code.slice(1,7)) + t(q + 71*m, code.slice(7)) + `</svg>`;
}

const CRC = (() => { const t = []; for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  for (const [name, text] of files){
    const nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(8,0,true);
    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(h.buffer), nb, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true);
    c.setUint16(28,nb.length,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer), nb);
    off += 30 + nb.length + data.length;
  }
  const csize = central.reduce((s,a) => s + a.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,csize,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)],
    {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function colName(i){ let s = ""; i++; while (i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function xesc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, ""); }

    return `<c r="${ref}" t="inlineStr"${ri === 0 ? ' s="1"' : ""}><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;

    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook ${NS} ${RNS}><sheets><sheet name="${xesc(sheetName.slice(0,31))}" sheetId="1" r:id="rId1"/></sheets></workbook>`],

  ]);
}

/* ---------- fotos (IndexedDB: guarda só a última foto de cada item em cada concorrente) ---------- */
const PhotoDB = (() => {
  let dbp = null;
  function db(){
    if (!dbp) dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open("dscanner-fotos", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("fotos");
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      } catch(e) { rej(e); }
    });
    return dbp;
  }
  async function run(mode, fn){
    const d = await db();
    return new Promise((res, rej) => {
      const t = d.transaction("fotos", mode); const req = fn(t.objectStore("fotos"));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error);
    });
  }
  return {
    put: (k, blob) => run("readwrite", s => s.put(blob, k)),
    get: k => run("readonly", s => s.get(k)),
    del: k => run("readwrite", s => s.delete(k)).catch(() => {}),
  };
})();

async function fileToImage(file){

function imageToCanvas(img, max, gray, upscale){
  const s = upscale ? max / Math.max(img.naturalWidth, img.naturalHeight) : Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  const g = c.getContext("2d"); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high"; g.drawImage(img, 0, 0, c.width, c.height);
  if (gray) {
    const d = g.getImageData(0, 0, c.width, c.height), a = d.data;
    for (let i = 0; i < a.length; i += 4) {
      let v = 0.299*a[i] + 0.587*a[i+1] + 0.114*a[i+2];
      v = Math.max(0, Math.min(255, (v - 128) * 1.4 + 128));   // mais contraste
      a[i] = a[i+1] = a[i+2] = v;
    }
    g.putImageData(d, 0, 0);
  }
  return c;
}
/* inverte só as áreas escuras da etiqueta (preço branco em fundo preto vira preto em fundo branco) */
function darkInverted(src){
  const c = imageToCanvas(src, 1000, false, true), W = c.width, H = c.height;
  const g = c.getContext("2d"), d = g.getImageData(0, 0, W, H), a = d.data;
  const gray = new Float32Array(W * H);
  for (let i = 0, j = 0; j < gray.length; i += 4, j++) gray[j] = 0.299*a[i] + 0.587*a[i+1] + 0.114*a[i+2];
  const I = new Float64Array((W + 1) * (H + 1));
  for (let y = 0; y < H; y++) { let row = 0; for (let x = 0; x < W; x++) { row += gray[y*W + x]; I[(y+1)*(W+1) + x+1] = I[y*(W+1) + x+1] + row; } }
  const r = Math.round(W * 0.08);
  let mask = new Uint8Array(W * H), dark = 0;
  for (let y = 0; y < H; y++) {
    const y0 = Math.max(0, y - r), y1 = Math.min(H, y + r + 1);
    for (let x = 0; x < W; x++) {
      const x0 = Math.max(0, x - r), x1 = Math.min(W, x + r + 1);
      const s = I[y1*(W+1) + x1] - I[y0*(W+1) + x1] - I[y1*(W+1) + x0] + I[y0*(W+1) + x0];
      if (s / ((x1 - x0) * (y1 - y0)) < 100) { mask[y*W + x] = 1; dark++; }
    }
  }
  if (dark < W * H * 0.03) return null;   // não tem área escura
  const k = 4, tmp = new Uint8Array(W * H);   // alarga a máscara um pouco
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let m = 0; for (let dx = -k; dx <= k && !m; dx++) { const xx = x + dx; if (xx >= 0 && xx < W && mask[y*W + xx]) m = 1; } tmp[y*W + x] = m; }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let m = 0; for (let dy = -k; dy <= k && !m; dy++) { const yy = y + dy; if (yy >= 0 && yy < H && tmp[yy*W + x]) m = 1; } mask[y*W + x] = m; }
  for (let j = 0, i = 0; j < gray.length; j++, i += 4) {
    let v = mask[j] ? 255 - gray[j] : gray[j];
    v = Math.max(0, Math.min(255, (v - 128) * 1.4 + 128));
    a[i] = a[i+1] = a[i+2] = v;
  }
  g.putImageData(d, 0, 0);
  return c;
}

/* Acha os valores grandes da etiqueta (os preços) */
function findPrices(words, text){
  const W = (words || []).map(w => ({ t: String(w.text || "").trim(), b: w.bbox || {x0:0,y0:0,x1:0,y1:0} }))
    .map(w => ({ ...w, h: w.b.y1 - w.b.y0, cx: (w.b.x0 + w.b.x1) / 2, cy: (w.b.y0 + w.b.y1) / 2 }));
  const fix = s => s.replace(/[Oo]/g, "0").replace(/[Il|]/g, "1").replace(/[Ss](?=\d)/g, "5");
  const cands = [];
  W.forEach((w, i) => {
    const t = fix(w.t);
    let m = t.match(/(\d{1,4})[,.](\d{2})(?!\d)/);
    if (m) { cands.push({ v: +(m[1] + "." + m[2]), h: w.h, cx: w.cx, cy: w.cy, y0: w.b.y0 }); return; }
    // centavos separados/pequenos: "21" "90" ou "21" ",90"
    m = t.match(/^(?:R\$)?(\d{1,4})[,.]?$/);
    if (m) {
      const n = W[i+1]; if (!n) return;
      const nm = fix(n.t).match(/^[,.]?(\d{2})$/);
      const sameLine = n.b.y0 < w.b.y1 && n.b.x0 >= w.b.x1 - 4 && n.b.x0 - w.b.x1 < w.h * 1.5;
      if (nm && sameLine) cands.push({ v: +(m[1] + "." + nm[1]), h: w.h, cx: w.cx, cy: w.cy, y0: w.b.y0 });
    }
  });
  let ok = cands.filter(c => c.v >= 0.1 && c.v < 10000);
  if (!ok.length) {
    const all = [...fix(text || "").matchAll(/(\d{1,4})\s?[,.]\s?(\d{2})(?!\d)/g)].map(m => +(m[1] + "." + m[2])).filter(v => v >= 0.1);
    return { vals: all };
  }
  // só os números grandes (os preços); descarta "média litro", "trib", "cxa"
  const maxH = Math.max(...ok.map(c => c.h));
  return { vals: [...new Set(ok.filter(c => c.h >= maxH * 0.6).map(c => c.v))] };
}
/* junta as leituras e escolhe o MENOR preço (descarta números que não parecem preço da mesma etiqueta) */
function lowestPrice(lists){
  const all = lists.flat().filter(v => v > 0);
  if (!all.length) return null;
  const mx = Math.max(...all);
  return Math.min(...all.filter(v => v >= mx * 0.5));
}

function validEAN(s){ return /^\d{13}$/.test(s) && ean13Check(s.slice(0, 12)) === s[12] || /^\d{8}$/.test(s); }
async function readBarcode(file){

/* Acha o produto da minha lista que mais combina com o texto da etiqueta */
const STOP = new Set(["de","da","do","das","dos","com","e","em","para","un","und","pct","cx","rs","r","preco","oferta","kg","g","ml","l","lt","por","t1","tp1","tipo"]);
function tokens(s){
  return norm(s).replace(/(\d+)[.,]?(\d*)\s*(kg|g|gr|ml|l|lt|lts)\b/g, (_, a, b, u) => a + (b ? "." + b : "") + ({gr:"g",lt:"l",lts:"l"}[u] || u))
    .split(/[^a-z0-9.]+/).map(t => t.replace(/^\.+|\.+$/g, "")).filter(t => t.length >= 2 && !STOP.has(t));
}
const isSize = t => /^\d+(\.\d+)?(kg|g|ml|l)$/.test(t);
function tokScore(pt, tagSet){
  if (tagSet.has(pt)) return 1;
  if (isSize(pt)) return 0;
  for (const t of tagSet) {
    if (t.length >= 3 && pt.startsWith(t)) return 0.75;   // abreviação na etiqueta: "arr" = "arroz"
    if (pt.length >= 3 && t.startsWith(pt)) return 0.9;    // abreviação no meu cadastro: "parb" = "parboilizado"
    if (pt.length >= 5 && t.length >= 5 && lev(pt, t) <= 1) return 0.85;   // erro de leitura
  }
  return 0;
}
function lev(a, b){
  if (Math.abs(a.length - b.length) > 1) return 2;
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function matchProducts(text, cid, ean){
  const tagToks = tokens(text), tagSet = new Set(tagToks);
  const digits = (text.match(/\d{8,14}/g) || []); if (ean) digits.push(ean);
  // 1º: código de barras já vinculado (vale para todos os concorrentes)
  if (ean) {
    const al = [...S.aliases].reverse().find(a => a.ean === ean);
    const p = al && S.products.find(x => x.id === al.productId);
    if (p) return [{ p, s: 1000, linked: true }];
  }
  const scores = new Map();
  for (const p of S.products) {
    let s = 0;
    if (p.barCode && digits.includes(p.barCode)) s = 100;
    else {
      const pt = tokens(p.name); if (!pt.length) continue;
      let got = 0, w = 0, hits = 0;
      for (const t of pt) { const k = isSize(t) ? 2 : 1; w += k; const sc = tokScore(t, tagSet); got += k * sc; if (sc > 0) hits++; }
      s = got / w + 0.05 * hits;   // mais palavras em comum = desempate
      const sizes = pt.filter(isSize);
      if (sizes.length && sizes.some(z => !tagSet.has(z)) && tagToks.some(isSize)) s *= 0.6;   // tamanho diferente
    }
    scores.set(p.id, s);
  }
  return [...scores.entries()].filter(([, s]) => s > 0.25).sort((a, b) => b[1] - a[1]).map(([id, s]) => ({ p: S.products.find(x => x.id === id), s }));
}
/* ---------- vínculo pela DESCRIÇÃO da etiqueta ---------- */
// palavras que aparecem em toda etiqueta e não dizem qual é o produto
const GENERIC = new Set("preco precos unidade unidades partir varejo atacado media litro litros trib cxa und uni oferta ref promocao valido ate por com para quilo cada leve pague".split(" "));
const GEN = [...GENERIC];
function grams(t){ const s = " " + t + " "; const g = new Set(); for (let i = 0; i < s.length - 2; i++) g.add(s.slice(i, i + 3)); return g; }
function wsim(a, b){   // parecença entre palavras (aguenta erros de leitura)
  if (a === b) return 1;
  const A = grams(a), B = grams(b); let n = 0; for (const x of A) if (B.has(x)) n++;
  return 2 * n / (A.size + B.size);
}
function descTokens(text){
  return [...new Set(norm(text || "").replace(/[^a-z\s]/g, " ").split(/\s+/)
    .filter(t => t.length >= 3 && !GENERIC.has(t) && !GEN.some(g => g.length >= 5 && wsim(t, g) >= 0.5)))].slice(0, 60);
}
function sampleScore(newToks, toks, df, N){
  let tot = 0, got = 0;
  for (const t of toks) {
    const w = Math.log((N + 1) / ((df.get(t) || 0) + 0.5));   // palavra comum em várias etiquetas vale menos
    if (w <= 0) continue;
    let best = 0; for (const u of newToks) { const s = wsim(t, u); if (s > best) best = s; }
    tot += w; got += w * (best >= 0.45 ? best : 0);
  }
  return tot ? got / tot : 0;
}
function linkMatch(text, cid){
  const L = S.links.filter(l => l.cid === cid); if (!L.length) return [];
  const q = descTokens(text); if (!q.length) return [];
  const df = new Map(); for (const l of L) for (const t of l.toks) df.set(t, (df.get(t) || 0) + 1);
  const best = new Map();
  for (const l of L) { const s = sampleScore(q, l.toks, df, L.length); if (s > (best.get(l.pid) || 0)) best.set(l.pid, s); }
  return [...best.entries()].map(([pid, s]) => ({ p: S.products.find(x => x.id === pid), s })).filter(r => r.p).sort((a, b) => b.s - a.s);
}
function rememberLink(cid, text, pid){
  const toks = descTokens(text); if (!toks.length) return;
  // tira vínculos de OUTROS itens com etiqueta quase igual (foi um vínculo errado corrigido)
  S.links = S.links.filter(l => !(l.cid === cid && l.pid !== pid && sampleScore(toks, l.toks, new Map(), 1) >= 0.6));
  S.links.push({ cid, pid, toks, at: Date.now() });
  const mine = S.links.filter(l => l.cid === cid && l.pid === pid);
  if (mine.length > 4) { const old = mine[0]; S.links = S.links.filter(l => l !== old); }   // guarda as 4 últimas fotos
  if (S.links.length > 5000) S.links.splice(0, S.links.length - 5000);
}
function rememberAlias(cid, text, productId, ean){
  if (!ean) return;
  S.aliases = S.aliases.filter(a => a.ean !== ean);
  S.aliases.push({ cid, ean, toks: [], productId });
}

/* Preço: igual ao app – digite só números, os 2 últimos são centavos */
function bindPriceInput(inp, initialCents, onEnter){
  let digits = initialCents > 0 ? String(initialCents) : "";
  const fmt = () => brl((parseInt(digits || "0", 10)) / 100);
  const put = () => { inp.value = fmt(); const L = inp.value.length; try { inp.setSelectionRange(L, L); } catch(e) {} };
  inp.value = fmt();
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); onEnter && onEnter(); return; }
    if (e.key === "Backspace") { e.preventDefault(); digits = digits.slice(0, -1); put(); return; }
    if (/^\d$/.test(e.key)) { e.preventDefault(); if (digits.length < 9) digits = (digits + e.key).replace(/^0+/, ""); put(); return; }
  });
  inp.addEventListener("input", () => { digits = inp.value.replace(/\D/g, "").replace(/^0+/, "").slice(0, 9); put(); });
  inp.addEventListener("focus", () => setTimeout(put, 0));
  return {
    value: () => parseInt(digits || "0", 10) / 100,
    set: v => { digits = v > 0 ? String(Math.round(v * 100)) : ""; inp.value = fmt(); }
  };
}

/* recorta a região da etiqueta em volta do código de barras (foto de longe) */
function cropAround(img, bc){
  const b = bc.box, sx = img.naturalWidth / bc.w, sy = img.naturalHeight / bc.h;
  const w = b.width * sx, x0 = b.x * sx, y0 = b.y * sy, x1 = x0 + w, y1 = (b.y + b.height) * sy;
  if (w > img.naturalWidth * 0.3) return null;   // a foto já é de perto
  const L = Math.max(0, x0 - 0.8 * w), T = Math.max(0, y0 - 1.8 * w);
  const R = Math.min(img.naturalWidth, x1 + 1.8 * w), B = Math.min(img.naturalHeight, y1 + 0.3 * w);
  const c = document.createElement("canvas"); c.width = R - L; c.height = B - T;
  c.getContext("2d").drawImage(img, L, T, R - L, B - T, 0, 0, R - L, B - T);
  const i2 = new Image(); i2.src = c.toDataURL("image/png");
  return new Promise(r => { i2.onload = () => r(i2); i2.onerror = () => r(null); });
}

/* Lê a etiqueta: código de barras (se tiver) + duas leituras de texto. Devolve texto, menor preço e código */
async function analyzeTag(file, img, onStatus){
  const bc = await readBarcode(file);
  onStatus("prep");
  const worker = await getOCR();
  const src = (bc && await cropAround(img, bc)) || img;
  onStatus(1);
  await worker.setParameters({ tessedit_pageseg_mode: "11" });
  const A = (await worker.recognize(imageToCanvas(src, 1000, true, true))).data;
  let B = null; const inv = darkInverted(src);
  if (inv) {   // 2ª leitura: área escura invertida (pega preço branco em fundo preto)
    onStatus(2);
    await worker.setParameters({ tessedit_pageseg_mode: "6" });
    B = (await worker.recognize(inv)).data;
  }
  const text = (A.text || "") + "\n" + (B ? B.text || "" : "");
  const va = findPrices(A.words, A.text).vals, vb = B ? findPrices(B.words, B.text).vals : [];
  const price = lowestPrice([va, vb]);
  // área escura sem preço lido = pode haver um preço menor que o leitor não pegou
  const darkUnread = !!inv && !vb.some(v => price && v <= price);
  return { text, price, darkUnread, ean: (bc && bc.code) || eanFromText(text) };
}

async function photoDialog(file, fixedProduct){
  const cid = S.selectedCompetitorId;
  const comp = S.competitors.find(c => c.id === cid);
  let loaded;
  try { loaded = await fileToImage(file); } catch(e) { toast("Não consegui abrir a foto"); return; }
  const ctx = { cid, comp, file, loaded, fixedProduct, chosen: fixedProduct || null, text: "", ean: null, price: null, ranked: [], cancelled: false };

  modal(`<h2>${fixedProduct ? esc(fixedProduct.name) : "Foto da etiqueta"}</h2>
    <p class="sub" style="margin:-8px 0 12px">Concorrente: <b style="color:var(--text)">${esc(comp.name)}</b></p>
    <img class="big-photo" style="max-height:30vh" src="${loaded.url}" alt="Foto da etiqueta">
    <div class="status" data-st><span class="spin"></span> Lendo etiqueta…</div>
    <div class="foot sticky"><button class="btn btn-ghost" data-x>Cancelar</button><button class="btn btn-white" data-man>Digitar o preço</button></div>`,
  m => {
    const st = m.querySelector("[data-st]");
    m.querySelector("[data-x]").onclick = () => { ctx.cancelled = true; URL.revokeObjectURL(loaded.url); close(); };
    m.querySelector("[data-man]").onclick = () => { ctx.cancelled = true; confirmScreen(ctx, "Digite o preço."); };
    ocrLogger = msg => {
      if (ctx.cancelled) return;
      if (msg.status === "recognizing text") st.innerHTML = `<span class="spin"></span> ${ctx.pass === 2 ? "Conferindo preço" : "Lendo etiqueta"}… ${Math.round(msg.progress * 100)}%`;
      else if (/load|initializ/.test(msg.status)) st.innerHTML = `<span class="spin"></span> Preparando leitor (só demora na 1ª vez)…`;
    };
    (async () => {
      try {
        const r = await analyzeTag(file, loaded.img, s => { ctx.pass = s; });
        if (ctx.cancelled) return;
        Object.assign(ctx, r);
      } catch(e) {
        if (ctx.cancelled) return;
        ctx.ocrFailed = true;
      }
      if (ctx.cancelled) return;
      ctx.cancelled = true;   // daqui em diante a tela é trocada
      // quem é o item?
      let sure = false;
      if (!fixedProduct) {
        const byEan = ctx.ean && [...S.aliases].reverse().find(a => a.ean === ctx.ean);
        const byEanP = byEan && S.products.find(p => p.id === byEan.productId) || (ctx.ean && S.products.find(p => p.barCode === ctx.ean));
        const L = linkMatch(ctx.text, cid);
        if (byEanP) { ctx.chosen = byEanP; sure = true; }
        else if (L.length && L[0].s >= 0.30 && L[0].s >= 1.8 * (L[1]?.s || 0)) { ctx.chosen = L[0].p; sure = true; }
        else if (L.length && L[0].s >= 0.15) ctx.chosen = L[0].p;
        const byName = matchProducts(ctx.text, cid, null);
        ctx.ranked = [...L.filter(x => x.s >= 0.12), ...byName.filter(x => !L.some(y => y.p === x.p))];
        if (!ctx.chosen && byName.length && byName[0].s >= 0.5) ctx.chosen = byName[0].p;
      }
      if (!fixedProduct && sure && ctx.price && !ctx.darkUnread) return autoSave(ctx);
      const msg = ctx.ocrFailed ? (navigator.onLine === false ? "Sem internet para o leitor automático. Digite o preço." : "Leitor automático indisponível. Digite o preço.")
        : !ctx.price ? "Não consegui ler o preço. Digite o valor."
        : ctx.darkUnread ? `Li ${brl(ctx.price)}, mas pode ter um preço MENOR na parte escura da etiqueta. Confira.`
        : fixedProduct ? "Confira o preço e salve. A etiqueta fica vinculada a este item."
        : ctx.chosen ? "Confira o item e o preço. Ao salvar, a etiqueta fica vinculada."
        : "Primeira vez desta etiqueta: escolha o seu item. Depois ele reconhece sozinho.";
      confirmScreen(ctx, msg);
    })();
  });
}

/* guarda preço + foto + vínculo; devolve uma função para desfazer */
async function commit(ctx, prod, price){
  const { cid } = ctx;
  const prevPrice = priceFor(cid, prod); const prevCopy = prevPrice ? { ...prevPrice } : null;
  const prevLinks = S.links.slice(), prevAliases = S.aliases.slice();
  const k = photoKey(cid, prod.id);
  let prevBlob = null; const prevStamp = S.photos[k];
  try { if (prevStamp) prevBlob = await PhotoDB.get(k); } catch(e) {}
  setPrice(cid, prod, price);
  if (ctx.text.trim()) rememberLink(cid, ctx.text, prod.id);
  if (ctx.ean && prod.barCode !== ctx.ean) rememberAlias(cid, "", prod.id, ctx.ean);
  save();   // grava o preço na hora
  try {     // guarda a foto nova no lugar da antiga
    const blob = await canvasToBlob(imageToCanvas(ctx.loaded.img, 1280, false), 0.72);
    await PhotoDB.put(k, blob); S.photos[k] = Date.now();
  } catch(e) { toast("Preço salvo, mas a foto não pôde ser guardada"); }
  save();
  return async () => {   // desfazer
    if (prevCopy) Object.assign(priceFor(cid, prod) || {}, prevCopy);
    else S.prices = S.prices.filter(p => !(p.competitorId === cid && p.productId === prod.id));
    S.links = prevLinks; S.aliases = prevAliases;
    if (prevBlob) { await PhotoDB.put(k, prevBlob); S.photos[k] = prevStamp; } else removePhoto(cid, prod.id);
    save();
  };
}

/* tela para conferir/escolher item e preço */
function confirmScreen(ctx, message){
  const { cid, comp, loaded, fixedProduct } = ctx;
  modal(`<h2>${fixedProduct ? esc(fixedProduct.name) : "Foto da etiqueta"}</h2>
    <p class="sub" style="margin:-8px 0 12px">Concorrente: <b style="color:var(--text)">${esc(comp.name)}</b></p>
    <img class="big-photo" style="max-height:24vh" src="${loaded.url}" alt="Foto da etiqueta">
    <div class="status ${ctx.price && !ctx.darkUnread ? "ok" : "warn"}">${esc(message)}</div>
    <div class="field" style="margin-top:14px"><label>Preço (o menor da etiqueta)</label><input inputmode="numeric" autocomplete="off" data-p></div>
    ${fixedProduct ? "" : `
      <div class="field" style="margin-top:6px"><label>Meu item</label><input type="search" data-q placeholder="Buscar o item"></div>
      <div class="choices" data-c></div>`}
    <div class="foot sticky">
      <button class="btn btn-ghost" data-x>Cancelar</button>
      <button class="btn btn-white" data-next>${IC.camera} Salvar + próx.</button>
      <button class="btn btn-orange" data-ok>Salvar</button>
    </div>`,
  m => {
    const pIn = m.querySelector("[data-p]");
    const pi = bindPriceInput(pIn, Math.round((ctx.price || 0) * 100), () => doSave(false));
    const q = m.querySelector("[data-q]"), box = m.querySelector("[data-c]");
    const draw = () => {
      if (!box) return;
      const nq = norm(q.value.trim());
      let list = nq ? [...S.products].sort(byName).filter(p => norm(p.name).includes(nq) || p.barCode.includes(nq))
                    : ctx.ranked.slice(0, 4).map(r => r.p);
      if (ctx.chosen && !list.includes(ctx.chosen)) list = [ctx.chosen, ...list];
      list = list.slice(0, nq ? 8 : 4);
      box.innerHTML = list.length ? list.map(p => {
        const pr = priceFor(cid, p);
        return `<button class="choice ${ctx.chosen === p ? "on" : ""}" data-id="${p.id}"><span>${esc(p.name)}</span>${pr ? `<small>atual ${brl(pr.price)}</small>` : ""}</button>`;
      }).join("") : `<p class="hint">Busque o seu item acima e toque nele.</p>`;
    };
    if (box) {
      box.onclick = e => { const b = e.target.closest("[data-id]"); if (!b) return; ctx.chosen = S.products.find(p => p.id === +b.dataset.id); draw(); };
      q.oninput = draw; draw();
    }
    const doSave = async (next) => {
      if (!ctx.chosen) { toast("Escolha o seu item"); q && q.focus(); return; }
      const price = pi.value();
      if (!(price > 0)) { toast("Informe o preço"); pIn.focus(); return; }
      const mine = layer.firstChild;
      if (next) { camTarget = null; cam.value = ""; cam.click(); }   // abre a câmera já, no toque
      await commit(ctx, ctx.chosen, price);
      URL.revokeObjectURL(loaded.url);
      if (layer.firstChild === mine) close();
      render(); toast(`${ctx.chosen.name}: ${brl(price)}`);
    };
    m.querySelector("[data-x]").onclick = () => { URL.revokeObjectURL(loaded.url); close(); };
    m.querySelector("[data-ok]").onclick = () => doSave(false);
    m.querySelector("[data-next]").onclick = () => doSave(true);
  });
}

  document.querySelectorAll("nav.bottom a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab || (tab === "" && a.dataset.tab === "pesquisa")));
  if (tab === "concorrentes") openCompetitorId ? renderCompetitor() : renderCompetitors();
  else renderResearch();
}

function renderResearch(){
  const comps = [...S.competitors].sort(byName);
  if (S.selectedCompetitorId && !S.competitors.some(c => c.id === S.selectedCompetitorId)) S.selectedCompetitorId = null;
  app.innerHTML = `
    <h1>PESQUISA DE PREÇO</h1>
    <div class="field"><label>Buscar produto</label><input id="q" type="search" placeholder="Nome ou código de barras" value="${esc(query)}"></div>
    <div class="row">
      <button class="btn btn-orange" id="addP">+ Produto</button>
      <button class="btn btn-orange" id="addC">+ Concorrente</button>
    </div>
    <div class="field" style="margin-top:18px">
      <label>Concorrente</label>
      <select id="sel">
        <option value="">${comps.length ? "Selecione concorrente" : "Nenhum concorrente – crie um"}</option>
        ${comps.map(c => `<option value="${c.id}" ${c.id === S.selectedCompetitorId ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
      </select><span class="chev">${IC.chev}</span>
    </div>
    <button class="btn btn-orange btn-cam" id="camBtn">${IC.camera} Foto da etiqueta</button>
    <p class="hint" style="text-align:center">Tire a foto de perto da etiqueta. Na 1ª vez você escolhe o item; depois ele reconhece sozinho.</p>
    <div class="list" id="list"></div>`;
  app.querySelector("#camBtn").onclick = () => openCamera(null);
  const q = app.querySelector("#q");
  q.oninput = () => { query = q.value; drawList(); };
  app.querySelector("#addP").onclick = newProductDialog;
  app.querySelector("#addC").onclick = newCompetitorDialog;
  app.querySelector("#sel").onchange = e => { S.selectedCompetitorId = e.target.value ? +e.target.value : null; save(); drawList(); if (S.selectedCompetitorId) warmOCR(); };
  drawList();
}

function drawList(){
  const list = document.getElementById("list");
  const nq = norm(query.trim());
  const items = [...S.products].sort(byName).filter(p => !nq || norm(p.name).includes(nq) || p.barCode.includes(nq));
  const cid = S.selectedCompetitorId;
  if (!items.length) { list.innerHTML = `<div class="empty-state">Nenhum produto encontrado.</div>`; return; }
  list.innerHTML = items.map(p => {
    const pr = cid ? priceFor(cid, p) : null;
    const k = cid ? photoKey(cid, p.id) : null;
    return `<div class="card">
      <div class="ptop">
        ${k && S.photos[k] ? `<button class="thumb" data-view="${p.id}" aria-label="Ver foto"><img data-photo="${k}" alt=""></button>` : ""}
        <p class="pname">${esc(p.name)}</p>
      </div>
      <div class="actions">
        <button class="btn btn-orange" data-bar="${p.id}" aria-label="Código de barras" ${sanitizeEAN13(p.barCode) ? "" : "disabled title='Sem código de barras'"}>${IC.barcode}</button>
        <button class="btn btn-orange grow" data-cam="${p.id}">${IC.camera} Foto</button>
        <button class="btn btn-white grow" data-edit="${p.id}">${IC.edit} Preço</button>
      </div>
      <div class="price ${pr ? "" : "empty"}">${pr ? "Preço: " + brl(pr.price) + (pr.price2 ? `<br><span class="stamp" style="font-size:14px">2º preço: ${brl(pr.price2)}</span>` : "") : (cid ? "Sem preço neste concorrente" : "Selecione um concorrente")}</div>
    </div>`;
  }).join("");
  fillThumbs(list);
  list.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const prod = S.products.find(p => p.id === +(b.dataset.bar || b.dataset.edit || b.dataset.cam || b.dataset.view));
    if (!prod) return;
    if (b.dataset.bar) return barcodeDialog(prod);
    if (b.dataset.view) return photoViewer(photoKey(cid, prod.id), prod.name);
    if (b.dataset.cam) return openCamera(prod);
    if (!S.selectedCompetitorId) { toast("Selecione ou crie um concorrente primeiro"); newCompetitorDialog(); return; }
    const existing = priceFor(S.selectedCompetitorId, prod);
    priceDialog(prod.name, existing, price => {
      setPrice(S.selectedCompetitorId, prod, price);
      save(); drawList(); toast("Preço salvo: " + brl(price));
    });
  };
}

function renderCompetitors(){
  const comps = [...S.competitors].sort(byName);
  app.innerHTML = `
    <div class="head"><h1 style="font-size:26px">Concorrentes</h1>
      <button class="btn btn-orange" id="exp" ${comps.length ? "" : "disabled"}>Exportar</button></div>
    ${comps.length ? `<div class="list">${comps.map(c => `
      <div class="card alt comp">
        <button class="cname" data-open="${c.id}">${esc(c.name)}</button>
        <span class="count">${pricesOf(c.id).length} ${pricesOf(c.id).length === 1 ? "produto" : "produtos"}</span>
        <button class="icon-btn" style="color:var(--red)" data-del="${c.id}" aria-label="Excluir">${IC.del}</button>
      </div>`).join("")}</div>`
    : `<div class="empty-state">Nenhum concorrente cadastrado ainda.</div>`}
    <div class="small-links">
      <button id="bk">Fazer backup dos dados</button>
      <button id="rs">Restaurar backup</button>
    </div>
    <input type="file" id="file" accept=".json,application/json" hidden>`;
  app.querySelector("#exp").onclick = () => exportDialog(xlsxAll, "Pesquisa_de_Precos.xlsx");
  app.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.open) { openCompetitorId = +b.dataset.open; render(); window.scrollTo(0,0); }
    if (b.dataset.del) {
      const c = S.competitors.find(x => x.id === +b.dataset.del);
      confirmBox("Excluir concorrente", `Excluir "${c.name}" e todos os preços dele?`, "Excluir", () => {
        S.competitors = S.competitors.filter(x => x.id !== c.id);
        S.prices = S.prices.filter(p => p.competitorId !== c.id);
        removeCompetitorPhotos(c.id); S.links = S.links.filter(l => l.cid !== c.id);
        save(); render();
      });
    }
  };
  app.querySelector("#bk").onclick = () => {
    const d = new Date().toISOString().slice(0,10);
    saveFile(new Blob([JSON.stringify(S, null, 1)], {type:"application/json"}), `DScanner_backup_${d}.json`);
  };
  const file = app.querySelector("#file");
  app.querySelector("#rs").onclick = () => file.click();
  file.onchange = async () => {
    const f = file.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data.products) || !Array.isArray(data.competitors) || !Array.isArray(data.prices)) throw 0;
      confirmBox("Restaurar backup", "Isso substitui todos os dados atuais deste navegador pelos do arquivo.", "Restaurar", () => {
        S = data; S.photos = S.photos || {}; S.aliases = S.aliases || []; S.links = S.links || []; save(); render(); toast("Backup restaurado");
      });
    } catch(e) { toast("Arquivo de backup inválido"); }
  };
}

function renderCompetitor(){
  const c = S.competitors.find(x => x.id === openCompetitorId);
  if (!c) { openCompetitorId = null; return renderCompetitors(); }
  const items = pricesOf(c.id);
  app.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" style="color:var(--primary)" id="back" aria-label="Voltar">${IC.back}</button>
      <h1>${esc(c.name)}</h1>
      <span class="badge">${items.length} ${items.length === 1 ? "produto" : "produtos"}</span>
      <button class="icon-btn" style="color:var(--red)" id="clr" aria-label="Limpar todos os produtos" ${items.length ? "" : "disabled"}>${IC.sweep}</button>
    </div>
    ${items.length ? `<div class="list">${items.map(p => `
      <div class="card alt">
        <div style="display:flex;align-items:flex-start;gap:8px">
          ${S.photos[photoKey(c.id, p.productId)] ? `<button class="thumb" data-view="${p.id}" aria-label="Ver foto"><img data-photo="${photoKey(c.id, p.productId)}" alt=""></button>` : ""}
          <p class="pname" style="flex:1;font-size:17px;margin:6px 0">${esc(p.name)}</p>
          <button class="icon-btn" style="color:var(--primary)" data-edit="${p.id}" aria-label="Editar">${IC.edit}</button>
          <button class="icon-btn" style="color:var(--red)" data-del="${p.id}" aria-label="Excluir">${IC.del}</button>
        </div>
        <div style="color:var(--primary);font-weight:600;font-size:16px">Preço: ${brl(p.price)}${p.price2 ? ` <span style="color:var(--muted);font-weight:400;font-size:14px">/ ${brl(p.price2)}</span>` : ""}</div>
        <div class="sub">Código de barras: ${esc(p.barCode || "—")}</div>
        ${p.updatedAt ? `<div class="stamp">Atualizado em ${new Date(p.updatedAt).toLocaleString("pt-BR", {dateStyle:"short", timeStyle:"short"})}</div>` : ""}
      </div>`).join("")}</div>`
    : `<div class="empty-state">Nenhum preço pesquisado neste concorrente ainda.<br>Vá em <b>Pesquisa</b>, selecione "${esc(c.name)}" e edite os preços.</div>`}
    ${items.length ? `<button class="fab" id="exp" aria-label="Exportar Excel">${IC.dl}</button>` : ""}`;
  app.querySelector("#back").onclick = () => { openCompetitorId = null; render(); };
  app.querySelector("#clr").onclick = () => confirmBox("Limpar produtos", `Apagar todos os ${items.length} preços de "${c.name}"?`, "Limpar", () => {
    S.prices = S.prices.filter(p => p.competitorId !== c.id); removeCompetitorPhotos(c.id); save(); render();
  });
  fillThumbs(app);
  const exp = app.querySelector("#exp");
  if (exp) exp.onclick = () => exportDialog(() => xlsxOne(c), `produtos_${safeName(c.name)}.xlsx`);
  app.onclick = e => {
    const b = e.target.closest("button[data-edit],button[data-del],button[data-view]"); if (!b) return;
    const p = S.prices.find(x => x.id === +(b.dataset.edit || b.dataset.del || b.dataset.view)); if (!p) return;
    if (b.dataset.view) return photoViewer(photoKey(c.id, p.productId), p.name);
    if (b.dataset.edit) priceDialog("Editar preço de " + p.name, p, price => { p.price = price; p.price2 = null; p.updatedAt = Date.now(); save(); render(); });
    else { removePhoto(c.id, p.productId); S.prices = S.prices.filter(x => x.id !== p.id); save(); render(); }
  };
}

window.addEventListener("hashchange", () => { openCompetitorId = null; app.onclick = null; render(); window.scrollTo(0,0); });
render();
if (S.selectedCompetitorId) warmOCR();
</script>
</body>
</html>
